<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruta de IA para desarrolladores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F2; --surface:#FFFFFF; --ink:#12263A; --muted:#4E606C; --line:#CDD9D7;
  --brand:#0E6E6E; --brand-ink:#FFFFFF; --accent:#F0A202; --accent-ink:#2A1D00;
  --ok:#1B7F4B; --ok-bg:#E1F3E9; --bad:#B4321F; --bad-bg:#FBE7E3; --tint:#DDEBE9;
  --code-bg:#F6F9F8;
  --font-head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1B1E; --surface:#14282C; --ink:#E6F0EE; --muted:#A3B8B5; --line:#284A4F;
    --brand:#4CC2B5; --brand-ink:#062123; --accent:#F5B83D; --accent-ink:#241900;
    --ok:#5ED49A; --ok-bg:#153A2A; --bad:#FF9585; --bad-bg:#43201B; --tint:#17363A; --code-bg:#0F2124;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1B1E; --surface:#14282C; --ink:#E6F0EE; --muted:#A3B8B5; --line:#284A4F;
  --brand:#4CC2B5; --brand-ink:#062123; --accent:#F5B83D; --accent-ink:#241900;
  --ok:#5ED49A; --ok-bg:#153A2A; --bad:#FF9585; --bad-bg:#43201B; --tint:#17363A; --code-bg:#0F2124;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.6}
h1,h2,h3{font-family:var(--font-head);line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4.5vw,2.8rem);font-weight:800}
h3{font-size:1.15rem;font-weight:700}
p{margin:0 0 1em;max-width:68ch}
button{font:inherit;color:inherit;cursor:pointer}
code{font-family:var(--mono);font-size:.9em;background:var(--tint);padding:1px 6px;border-radius:5px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:10px 20px}
.brand{font-family:var(--font-head);font-weight:800;font-size:1.05rem;white-space:nowrap}
.meter{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.meter .bar{flex:1;height:10px;background:var(--tint);border-radius:99px;overflow:hidden}
.meter .fill{height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.meter span{font-size:.9rem;color:var(--muted);white-space:nowrap}
.toggle{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:.9rem}
.toggle[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.app{display:grid;grid-template-columns:290px minmax(0,1fr);gap:32px;max-width:1180px;margin:0 auto;padding:24px 20px 60px}
.route{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;list-style:none;margin:0;padding:0}
.route li{position:relative}
.route li:not(:last-child)::before{content:"";position:absolute;left:15px;top:34px;bottom:-8px;width:3px;background:var(--line);border-radius:2px}
.route li.done:not(:last-child)::before{background:var(--brand)}
.stop{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:6px 6px 6px 0;border-radius:10px;margin-bottom:8px}
.stop:hover .label{text-decoration:underline}
.node{flex:none;width:34px;height:34px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;font-family:var(--font-head);font-weight:700;font-size:.9rem;position:relative;z-index:1}
.done .node{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.active .node{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.label{display:block;font-weight:700;line-height:1.25}
.time{display:block;font-size:.85rem;color:var(--muted)}
.active .label{color:var(--brand)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,40px)}
.kicker{color:var(--muted);font-size:.95rem;margin-bottom:6px}
.lead{font-size:1.1rem}
.block{margin-top:34px}
.block>h3{margin-bottom:.3em}
.hint{color:var(--muted);font-size:.95rem}

.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:700;border-radius:12px;padding:10px 18px}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.small{padding:5px 12px;font-size:.9rem;border-radius:9px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.facil{margin:0 0 26px;background:color-mix(in srgb,var(--accent) 22%,var(--surface));border-left:6px solid var(--accent);border-radius:10px;padding:12px 16px}
.facil strong{font-family:var(--font-head)}
.facil p{margin:.3em 0 0}

details{border:1px solid var(--line);border-radius:12px;padding:0 16px;margin-bottom:10px;background:var(--bg)}
summary{cursor:pointer;font-weight:700;padding:12px 0}
details[open]{padding-bottom:6px}

.myth{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.myth p{margin:0 0 10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:7px 14px;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin:10px 0 0;padding:10px 14px;border-radius:10px;font-size:.98rem}
.fb.ok{background:var(--ok-bg);border-left:5px solid var(--ok)}
.fb.no{background:var(--bad-bg);border-left:5px solid var(--bad)}
.score{font-family:var(--font-head);font-weight:700;color:var(--brand)}

.practice{background:var(--tint);border-radius:14px;padding:16px 18px;margin-top:16px}
.practice h4{margin:0 0 6px;font-family:var(--font-head)}
.prompt{background:var(--surface);border:1px dashed var(--brand);border-radius:10px;padding:12px 14px;white-space:pre-wrap;font-size:.98rem;margin:8px 0 10px}
.prompt.mono{font-family:var(--mono);font-size:.86rem;background:var(--code-bg);border-style:solid;border-color:var(--line);overflow-x:auto}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp>div{border-radius:12px;padding:14px 16px;border:2px solid var(--line)}
.cmp .bad{border-color:var(--bad);background:var(--bad-bg)}
.cmp .good{border-color:var(--ok);background:var(--ok-bg)}
.cmp h4{margin:0 0 6px;font-family:var(--font-head)}
.cmp p{margin:0;font-size:.98rem}

.field{margin-bottom:14px}
.field label{display:flex;justify-content:space-between;gap:10px;font-weight:700;margin-bottom:4px}
.field .tick{color:var(--ok);font-weight:700;visibility:hidden}
.field.filled .tick{visibility:visible}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
textarea.mono{font-family:var(--mono);font-size:.9rem}
textarea:focus,input[type=text]:focus{border-color:var(--brand);outline:none}
.builder{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);border:2px solid var(--brand);border-radius:14px;padding:14px 16px;background:var(--bg)}
.preview .out{white-space:pre-wrap;min-height:90px;font-size:.98rem}
.preview .out.empty{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.95rem;text-align:left}
.chip:hover{border-color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.stats div{background:var(--tint);border-radius:12px;padding:10px 14px}
.stats b{display:block;font-family:var(--font-head);font-size:1.5rem;line-height:1.1}
.stats span{font-size:.9rem;color:var(--muted)}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700}
.tab[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tpl{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:12px}
.tpl h4{margin:0;font-family:var(--font-head)}
.loop{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.loop>div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.loop b{font-family:var(--font-head);display:block;margin-bottom:2px}
.loop span{font-size:.93rem;color:var(--muted)}

.spot{border:1px solid var(--line);border-radius:14px;padding:8px;background:var(--code-bg)}
.sent{display:block;width:100%;text-align:left;background:none;border:2px solid transparent;border-radius:10px;padding:5px 12px;font-family:var(--mono);font-size:.86rem;white-space:pre-wrap}
.sent:hover:not(:disabled){background:var(--tint)}
.sent.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,transparent)}
.sent.hit{border-color:var(--ok);background:var(--ok-bg)}
.sent.miss{border-color:var(--bad);background:var(--bad-bg)}
.sent small{display:block;color:var(--muted);margin-top:4px;font-family:var(--font-body);font-size:.9rem;white-space:normal}

.priv{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.priv .fb{grid-column:1/-1;margin:0}

.rating{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.scale{display:flex;gap:6px}
.scale button{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.scale button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.scale-hint{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);max-width:280px;margin-left:auto;margin-top:6px}

.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--brand);flex:none}

.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.case{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:14px}
.case[aria-pressed="true"]{border-color:var(--brand);background:var(--tint)}
.case strong{display:block;font-family:var(--font-head);margin-bottom:4px}
.case span{font-size:.95rem;color:var(--muted)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.roles>div{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.roles b{font-family:var(--font-head)}
.steps{margin:0;padding-left:1.2em}
.steps li{margin-bottom:6px}
.clist{margin:0;padding-left:1.1em;font-size:.97rem}
.clist li{margin-bottom:4px}

table.cmpt{width:100%;border-collapse:collapse}
.cmpt th,.cmpt td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
.delta.up{color:var(--ok);font-weight:700}
.delta.down{color:var(--bad);font-weight:700}
.scroll{overflow-x:auto}

.foot{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg)}
.card h4{margin:0 0 4px;font-family:var(--font-head)}
.card p{margin:0;font-size:.97rem}
.plan-list{list-style:none;padding:0;margin:0}
.plan-list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.plan-list span:last-child{color:var(--muted);white-space:nowrap}
.note{border-left:5px solid var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface));border-radius:8px;padding:10px 14px;font-size:.96rem;margin-top:16px}
.note p{margin:0}

@media (max-width:900px){
  .app{grid-template-columns:1fr;gap:16px;padding:16px 14px 50px}
  .route{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:10;display:flex;gap:4px;overflow-x:auto;background:var(--bg);padding:8px 14px;margin:0 -14px;border-bottom:1px solid var(--line)}
  .route li{flex:none}
  .route li::before{display:none!important}
  .stop{margin:0;padding:4px 10px 4px 4px;gap:8px}
  .time{display:none}
  .label{font-size:.85rem;max-width:110px}
  .builder,.cmp,.cases,.roles,.two,.three{grid-template-columns:1fr}
  .loop{grid-template-columns:1fr 1fr}
  .preview{position:static}
  .brand{display:none}
}

:root{--f1:#0E6E6E;--f2:#2D5FB3;--f3:#7B3FA3;--f4:#A85A0B;--f5:#1B7F4B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--f1:#4CC2B5;--f2:#7FAAF0;--f3:#C59BE8;--f4:#F0A85A;--f5:#5ED49A}}
:root[data-theme="dark"]{--f1:#4CC2B5;--f2:#7FAAF0;--f3:#C59BE8;--f4:#F0A85A;--f5:#5ED49A}

.fig{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--bg);margin:14px 0}
.fig-cap{font-size:.88rem;color:var(--muted);margin:10px 0 0;max-width:none}
.badge{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--tint);color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}

.ntp-sent{font-size:1.15rem;font-family:var(--font-head);font-weight:600;margin:0 0 12px;max-width:none}
.ntp-sent .gen{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 8px}
.cand{display:grid;grid-template-columns:170px 1fr 44px;gap:10px;align-items:center;margin-bottom:6px;font-size:.95rem}
.cand .track{height:16px;background:var(--tint);border-radius:99px;overflow:hidden}
.cand .bar2{height:100%;background:var(--brand);border-radius:99px}
.cand.picked .bar2{background:var(--accent)}
.cand.picked code{background:var(--accent);color:var(--accent-ink)}

.ctxbar{display:flex;height:34px;border-radius:10px;overflow:hidden;border:2px solid var(--line);background:var(--surface)}
.ctxbar span{display:block;height:100%;border-right:2px solid var(--surface)}
.ctxmeta{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-top:6px}
.ctxmeta .over{color:var(--bad);font-weight:700}

.seegrid{display:grid;grid-template-columns:1fr 70px 1fr;gap:10px;align-items:stretch}
.see,.nosee{border-radius:12px;padding:12px 14px;border:2px solid}
.see{border-color:var(--ok);background:var(--ok-bg)}
.nosee{border-color:var(--bad);background:var(--bad-bg);border-style:dashed}
.see h4,.nosee h4{margin:0 0 6px;font-family:var(--font-head)}
.see ul,.nosee ul{margin:0;padding-left:1.1em;font-size:.95rem}
.ai-mid{display:grid;place-items:center}
.ai-bubble{width:62px;height:62px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--font-head);font-weight:800;font-size:1.2rem}

.flow{display:flex;align-items:stretch}
.fstep{flex:1;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font-size:.93rem}
.fstep b{display:block;font-family:var(--font-head);margin-bottom:2px}
.fstep.warn{border-color:var(--bad);background:var(--bad-bg)}
.fstep.good{border-color:var(--ok);background:var(--ok-bg)}
.farrow{flex:none;width:26px;display:grid;place-items:center;color:var(--muted);font-weight:700}
.niche{display:grid;grid-template-columns:130px 1fr;gap:8px 10px;align-items:center;font-size:.93rem}
.niche .track{height:14px;background:var(--tint);border-radius:99px;overflow:hidden}
.niche .track i{display:block;height:100%;background:var(--brand);border-radius:99px}
.niche .track i.low{background:var(--bad)}

.seg{background:color-mix(in srgb,var(--c) 20%,transparent);border-bottom:3px solid var(--c);padding:0 2px;border-radius:3px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:.85rem}
.pline{border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:6px;padding:4px 10px;margin-bottom:6px}
.ptag{display:block;font-size:.78rem;font-weight:700;color:var(--c)}
.clar{display:flex;gap:4px;margin:8px 0}
.clar i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.clar i.on{background:var(--brand)}

.pipe{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.pn{border:2px solid var(--brand);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:700;text-align:left;min-width:120px}
.pn small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.pn[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.pn[aria-pressed="true"] small{color:var(--brand-ink)}
.pn.dashed{border-style:dashed}
.parrow{color:var(--muted);font-weight:700}
.tipbox{margin-top:12px;border:2px solid var(--brand);border-radius:12px;padding:12px 16px;background:var(--surface)}
.tipbox h4{margin:0 0 6px;font-family:var(--font-head)}
.tipbox dl{margin:0;display:grid;grid-template-columns:90px 1fr;gap:6px 12px;font-size:.96rem}
.tipbox dt{font-weight:700;color:var(--brand)}
.tipbox dd{margin:0}

.light3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lt{border-radius:12px;padding:12px 14px;border:2px solid}
.lt h4{margin:0 0 4px;font-family:var(--font-head)}
.lt ul{margin:0;padding-left:1.1em;font-size:.95rem}
.lt p{margin:8px 0 0;font-size:.9rem;color:var(--muted)}
.lt.g{border-color:var(--ok);background:var(--ok-bg)}
.lt.y{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.lt.r{border-color:var(--bad);background:var(--bad-bg)}

.tbar{display:flex;border-radius:10px;overflow:hidden;border:2px solid var(--line);margin:8px 0 14px}
.tbar div{padding:8px 4px;font-size:.78rem;text-align:center;border-right:2px solid var(--surface);background:var(--tint);overflow:hidden}
.tbar div:last-child{border-right:0}
.tbar b{display:block;font-size:1rem;font-family:var(--font-head)}

svg.cycle{width:100%;max-width:540px;height:auto;display:block;margin:0 auto}
svg.cycle .box{fill:var(--surface);stroke:var(--brand);stroke-width:2.5}
svg.cycle text{fill:var(--ink);font-family:var(--font-body)}
svg.cycle .t1{font-weight:700;font-size:16px}
svg.cycle .t2{font-size:13px;fill:var(--muted)}
svg.cycle .arr{stroke:var(--brand);stroke-width:3;fill:none}
svg.cycle .mid{font-size:14px;fill:var(--muted)}

@media (max-width:900px){
  .seegrid{grid-template-columns:1fr}
  .ai-mid{padding:2px 0}
  .flow{flex-direction:column}
  .farrow{width:auto;height:24px;transform:rotate(90deg)}
  .light3{grid-template-columns:1fr}
  .cand{grid-template-columns:120px 1fr 40px}
  .niche{grid-template-columns:100px 1fr}
  .tipbox dl{grid-template-columns:1fr;gap:2px}
  .tipbox dt{margin-top:6px}
}

[hidden]{display:none!important}
.topbar{flex-wrap:wrap}
.rchip{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--tint);color:var(--ink);white-space:nowrap}
.rchip.admin{background:var(--accent);color:var(--accent-ink)}
.sync{font-size:.8rem;color:var(--muted);min-width:64px}
.vtabs{display:flex;gap:6px;flex-wrap:wrap}
.vt{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-weight:700;font-size:.9rem}
.vt[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.banner{background:color-mix(in srgb,var(--accent) 22%,var(--surface));border-bottom:1px solid var(--line);padding:8px 20px;font-size:.93rem}
.app.wide{grid-template-columns:1fr}
.app.wide .route{display:none}

.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.stats4>div{background:var(--tint);border-radius:12px;padding:12px 14px}
.stats4 b{display:block;font-family:var(--font-head);font-size:1.7rem;line-height:1.1}
.stats4 span{font-size:.88rem;color:var(--muted)}
.hbar{display:grid;grid-template-columns:170px 1fr 74px;gap:10px;align-items:center;font-size:.92rem;margin-bottom:6px}
.hbar .track{height:14px;background:var(--tint);border-radius:99px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--brand);border-radius:99px}
.hbar.two .track{height:24px;display:flex;flex-direction:column;gap:2px;padding:2px 0;border-radius:8px}
.hbar.two .track i{height:9px}
.hbar.two .track i.pre{background:var(--muted);opacity:.55}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;align-items:center}
.filters input,.filters select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 12px}
.filters input{flex:1;min-width:180px}
table.ptab td,table.ptab th{white-space:nowrap}
.pn2{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--tint)}
.mini{display:inline-block;width:90px;height:10px;background:var(--tint);border-radius:99px;overflow:hidden;vertical-align:middle;margin-right:6px}
.mini i{display:block;height:100%;background:var(--brand)}
.st{font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px}
.st.done{background:var(--ok-bg);color:var(--ok)}
.st.prog{background:color-mix(in srgb,var(--accent) 25%,var(--surface))}
.st.none{background:var(--tint);color:var(--muted)}
.regform{max-width:520px}
.regform select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.errtxt{color:var(--bad);font-weight:700;margin:10px 0}
@media (max-width:900px){
  .stats4{grid-template-columns:1fr 1fr}
  .hbar{grid-template-columns:110px 1fr 60px}
  .banner{padding:8px 14px}
  .topbar{padding:8px 14px;gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{.topbar,.route,.foot,.btn,.toggle{display:none!important}.app{display:block}}

async function api(path, opt){
  opt = opt || {};
  const headers = {"Content-Type":"application/json"};
  const tk = opt.admin ? CLOUD.adminToken : CLOUD.token;
  if(tk) headers["Authorization"] = "Bearer " + tk;
  let res;
  try{ res = await fetch("api" + path, {method:opt.method||"GET", headers, body: opt.body ? JSON.stringify(opt.body) : undefined}); }
  catch(e){ const er = new Error("network"); er.code = "network"; throw er; }
  if(!res.ok){
    const er = new Error("http"); er.status = res.status;
    er.code = res.status===401 ? "unauthorized" : res.status===429 ? "rate_limited" : "http_" + res.status;
    throw er;
  }
  return res.status===204 ? null : res.json();
}
function scheduleSync(){ if(!canSync()) return; CLOUD.dirty=true; clearTimeout(CLOUD.timer); CLOUD.timer=setTimeout(flush,1500); }

function practice(title, text, note){
  return `<div class="practice"><h4>${esc(title)}</h4>${note?`<p style="margin:0 0 4px">${note}</p>`:""}<div class="prompt">${esc(text)}</div>${copyBtn(text)}</div>`;

function quiz(id){
  const q = QUIZ[id], sel = S.quiz[id], answered = sel !== undefined;
  return `<div class="myth"><p><b>${esc(q.q)}</b></p><div class="opts" style="flex-direction:column;align-items:stretch">` +
    q.o.map((o,i)=>{
      let cls = "opt";
      if(answered){ if(i===q.c) cls+=" right"; else if(i===sel) cls+=" wrong"; }
      return `<button class="${cls}" style="text-align:left" data-a="quiz" data-id="${id}" data-v="${i}" ${answered?"disabled":""}>${esc(o)}</button>`;
    }).join("") + `</div>` +

function ntpHtml(){
  const n = S.ntp, ph = NTP[n.i];
  const last = n.picks.length ? n.picks[n.picks.length-1] : null;
  const tally = {ok:0,exists:0,fake:0};
  n.picks.forEach(k=>{ if(ph.c[k]) tally[ph.c[k].s]++; });
  let msg = "";
  if(last!==null && ph.c[last]){
    const st = ph.c[last].s;
    msg = st==="ok" ? `<div class="fb ok" role="status"><b>Acertó esta vez.</b> Genera otra vez: no siempre será igual.</div>`
        : st==="exists" ? `<div class="fb no" role="status"><b>Es real, pero no es la mejor respuesta.</b> ${esc(ph.ex)}</div>`
        : `<div class="fb no" role="status"><b>Inventó algo que suena correcto.</b> ${esc(ph.note)}</div>`;
  }
  return `<div class="fig">
    <span class="badge">Probabilidades ilustrativas</span>
    <p class="ntp-sent" style="margin-top:10px">${esc(ph.p)} <span class="gen">${last!==null?esc(ph.c[last].w):"…"}</span></p>
    ${ph.c.map((c,i)=>`<div class="cand ${last===i?"picked":""}"><span><code>${esc(c.w)}</code></span><div class="track"><div class="bar2" style="width:${c.v}%"></div></div><span>${c.v}%</span></div>`).join("")}

    ${msg}
    ${n.picks.length?`<p class="hint" style="margin:10px 0 0">Intentos: ${n.picks.length}. Correctas: ${tally.ok}. Con problemas: ${tally.exists+tally.fake}.</p>`:""}
    <p class="fig-cap">El modelo no consulta la documentación: elige según probabilidad. Por eso conviene verificar.</p></div>`;
}
function ctxHtml(){
  let total = 0; CTX.forEach(c=>{ if(S.ctx[c.k]) total += c.t; });
  let used = 0; const segs = [];
  CTX.forEach(c=>{ if(S.ctx[c.k]){ const w = Math.max(0, Math.min(c.t, CTX_CAP-used)); used += w; if(w>0) segs.push(`<span title="${esc(c.n)}" style="width:${w/CTX_CAP*100}%;background:${c.c}"></span>`); } });
  const pct = Math.round(total/CTX_CAP*100), over = total>CTX_CAP;
  const msg = over ? "Te pasaste: parte de lo que pegaste se perdería o la respuesta empeoraría." : pct>60 ? "Se está llenando: queda poco espacio para la respuesta." : "Buen equilibrio: solo lo relevante.";
  return `<div class="fig"><span class="badge">Ilustrativo: el tamaño real depende de la herramienta</span>
    <div class="ctxbar" style="margin-top:10px" role="img" aria-label="Uso de la ventana de contexto: ${pct}%">${segs.join("")}</div>
    <div class="ctxmeta"><span>${total.toLocaleString("es")} de ${CTX_CAP.toLocaleString("es")} unidades</span><span class="${over?"over":""}">${pct}%</span></div>
    <div class="fb ${over?"no":"ok"}" role="status">${msg}</div>

async function flush(){
  if(CLOUD.saving){ CLOUD.dirty=true; return; }
  if(!CLOUD.dirty || !canSync()) return;
  CLOUD.saving=true; CLOUD.dirty=false; setSync("saving");
  try{
    const st = JSON.parse(JSON.stringify(S)); st.tok = (st.tok||"").slice(0,10000);
    await api("/state", {method:"PUT", body:{state:st, summary:summary()}});
    setSync("saved");
  }catch(e){
    if(e.code==="unauthorized"){
      CLOUD.token=""; try{ localStorage.removeItem(TOKEN_KEY); }catch(_){}
      CLOUD.role="guest"; setSync(""); V.view="registro"; initRegForm(); render(false);
    } else { CLOUD.dirty=true; setSync("error"); clearTimeout(CLOUD.timer); CLOUD.timer=setTimeout(flush, 6000); }
  }
  CLOUD.saving=false;
  if(CLOUD.dirty && CLOUD.sync!=="error"){ clearTimeout(CLOUD.timer); CLOUD.timer=setTimeout(flush,800); }
}

function afterRole(){
  if(CLOUD.role==="admin") V.view = "panel";
  else if(CLOUD.role==="guest"){ V.view = "registro"; initRegForm(); }
  render(false);
}
async function initCloud(){
  try{ CLOUD.token = localStorage.getItem(TOKEN_KEY)||""; CLOUD.adminToken = localStorage.getItem(ADMIN_KEY)||""; }catch(e){}
  if(CLOUD.adminToken){
    try{ await api("/admin/me", {admin:true}); CLOUD.role="admin"; startAdmin(); afterRole(); return; }
    catch(e){ if(e.code==="network"){ CLOUD.role="local"; afterRole(); return; } CLOUD.adminToken=""; try{ localStorage.removeItem(ADMIN_KEY); }catch(_){} }
  }
  if(CLOUD.token){
    try{ const me = await api("/me"); enterAsParticipant(me, false); afterRole(); return; }
    catch(e){
      if(e.code==="network"){ CLOUD.role="local"; afterRole(); return; }
      if(e.code==="unauthorized"){ CLOUD.token=""; try{ localStorage.removeItem(TOKEN_KEY); }catch(_){} }
      else { CLOUD.role="local"; afterRole(); return; }
    }
  }
  CLOUD.role="guest"; afterRole();
}

/* ---------- registro ---------- */

const NIVELES = ["Ninguna","Básica","Intermedia","Avanzada"];

async function saveReg(){
  if(V.busy) return;
  const f = V.rf;
  const err = !f.fullName.trim() ? "Escribe tu nombre." : !f.area.trim() ? "Indica tu área o equipo." : !f.consent ? "Debes aceptar que los superadmins vean tu avance." : "";
  if(err){ V.regErr = err; render(true); return; }
  V.regErr = ""; V.busy = true;
  const body = {fullName:f.fullName.trim().slice(0,80), area:f.area.trim().slice(0,80), cargo:f.cargo, nivel:f.nivel};
  try{
    if(CLOUD.role==="participant"){
      const r = await api("/me", {method:"PUT", body});
      S.reg = Object.assign({}, body, {consent:true, registeredAt:r.registeredAt});
    } else {
      const r = await api("/register", {method:"POST", body:Object.assign({}, body, {consent:true})});
      CLOUD.token = r.token; try{ localStorage.setItem(TOKEN_KEY, r.token); }catch(e){}
      CLOUD.role = "participant"; CLOUD.uid = r.participant.id;
      S.reg = Object.assign({}, body, {consent:true, registeredAt:r.participant.registeredAt});
    }
  }catch(e){
    V.busy = false;
    V.regErr = e.code==="network" ? "No se pudo conectar. Revisa tu internet e intenta de nuevo." : e.code==="rate_limited" ? "Demasiados intentos. Espera unos minutos." : "No se pudo guardar tu registro. Intenta de nuevo.";
    render(true); return;
  }
  V.busy = false;
  save(); flushNow();
  V.view = "ruta"; render(false);
}

/* ---------- panel de superadmin ---------- */
const SKILL_SHORT = ["LLM y límites","Prompts claros","Uso en el flujo diario","Verificación","Datos y seguridad"];
function nameOf(p){ return p.fullName || (PROF[p.id]&&PROF[p.id].name) || "Sin nombre"; }
function pct(p){ return Math.round(((p.done||[]).length)/STEPS.length*100); }
function stateOf(p){ const n=(p.done||[]).length; return n===0?"No iniciado":n>=STEPS.length?"Completó":"En curso"; }
function gain(p){
  const ks = Object.keys(p.pre||{}).filter(k=>p.post && p.post[k]!==undefined);
  return ks.length ? ks.reduce((a,k)=>a+(p.post[k]-p.pre[k]),0)/ks.length : null;
}
function fmtDate(ms){ try{ return new Date(ms).toLocaleString("es",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
function filtered(){
  const q = (V.q||"").trim().toLowerCase();
  return PART.filter(p=>{
    if(q && !(nameOf(p).toLowerCase().includes(q) || (p.area||"").toLowerCase().includes(q))) return false;
    if(V.area && (p.area||"")!==V.area) return false;
    if(V.state && stateOf(p)!==V.state) return false;
    return true;
  }).sort((a,b)=>(b.lastActivity||0)-(a.lastActivity||0));
}

function fillPanel(){
  if(!byId("ptable")) return;
  const all = PART, n = all.length;
  const avgPct = n ? Math.round(all.reduce((a,p)=>a+pct(p),0)/n) : 0;
  const comp = all.filter(p=>stateOf(p)==="Completó").length;
  const gs = all.map(gain).filter(x=>x!==null);
  const g = gs.length ? gs.reduce((a,b)=>a+b,0)/gs.length : null;
  byId("pstats").innerHTML =
    `<div><b>${n}</b><span>personas registradas</span></div><div><b>${avgPct}%</b><span>avance promedio</span></div><div><b>${comp}</b><span>completaron la ruta</span></div><div><b>${g===null?"—":(g>0?"+":"")+g.toFixed(1)}</b><span>mejora en autoevaluación</span></div>`;
  byId("pbars").innerHTML = n ? STEPS.map(st=>{
    const c = all.filter(p=>(p.done||[]).includes(st.id)).length;
    return `<div class="hbar"><span>${esc(st.nav)}</span><div class="track"><i style="width:${Math.round(c/n*100)}%"></i></div><span>${c} de ${n}</span></div>`;
  }).join("") : `<p class="hint">Aún no hay personas registradas.</p>`;
  byId("pskills").innerHTML = n ? SKILLS.map((_,i)=>{
    const pre = all.map(p=>(p.pre||{})[i]).filter(x=>typeof x==="number"), post = all.map(p=>(p.post||{})[i]).filter(x=>typeof x==="number");
    const a = pre.length ? pre.reduce((x,y)=>x+y,0)/pre.length : 0, b = post.length ? post.reduce((x,y)=>x+y,0)/post.length : 0;
    return `<div class="hbar two"><span>${esc(SKILL_SHORT[i])}</span><div class="track"><i class="pre" style="width:${a/5*100}%"></i><i style="width:${b/5*100}%"></i></div><span>${pre.length?a.toFixed(1):"—"} → ${post.length?b.toFixed(1):"—"}</span></div>`;
  }).join("") : "";
  const areas = [...new Set(all.map(p=>p.area).filter(Boolean))].sort();
  byId("parea").innerHTML = `<option value="">Todas las áreas</option>` + areas.map(a=>`<option value="${esc(a)}" ${V.area===a?"selected":""}>${esc(a)}</option>`).join("");
  const rows = filtered();
  const stCls = {"Completó":"done","En curso":"prog","No iniciado":"none"};
  byId("ptable").innerHTML = !CLOUD.partReady ? `<p class="hint">Cargando participantes…</p>` : rows.length ? `<table class="cmpt ptab"><thead><tr><th>Participante</th><th>Área</th><th>Cargo</th><th>Avance</th><th>Estado</th><th>Última actividad</th><th></th></tr></thead><tbody>${
    rows.map(p=>{
      const av = PROF[p.id] && PROF[p.id].avatarUrl;
      return `<tr><td><span class="pn2">${av?`<img class="av" alt="" src="${esc(av)}">`:""}${esc(nameOf(p))}</span></td><td>${esc(p.area||"—")}</td><td>${esc(p.cargo||"—")}</td><td><span class="mini"><i style="width:${pct(p)}%"></i></span><span class="hint">${(p.done||[]).length}/${STEPS.length}</span></td><td><span class="st ${stCls[stateOf(p)]}">${stateOf(p)}</span></td><td>${p.lastActivity?fmtDate(p.lastActivity):"—"}</td><td><button class="btn small ghost" data-a="psel" data-id="${esc(p.id)}">Ver</button></td></tr>`;
    }).join("")}</tbody></table>` : `<p class="hint">${n?"Ninguna persona coincide con los filtros.":"Aún no hay personas registradas. Comparte el enlace con tus participantes."}</p>`;
  byId("pdetail").innerHTML = detailHtml();
}

  const sc = p.scores||{}, done = p.done||[];
  const confirming = V.delId===p.id;
  return `<div class="fig" style="margin-top:16px">
    <div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(nameOf(p))}</h3><button class="btn small ghost" data-a="pclose">Cerrar</button></div>
    <p class="hint" style="margin:6px 0 12px">${esc(p.area||"Sin área")} · ${esc(p.cargo||"Sin cargo")} · Experiencia con IA: ${esc(p.nivel||"—")}<br>Registrado: ${p.registeredAt?fmtDate(p.registeredAt):"—"} · Última actividad: ${p.lastActivity?fmtDate(p.lastActivity):"—"}</p>
    <div class="two">
      <div class="card"><h4>Módulos</h4><ul class="clist">${STEPS.map(st=>`<li>${done.includes(st.id)?"✓":"·"} ${esc(st.nav)}</li>`).join("")}</ul></div>
      <div class="card"><h4>Resultados</h4><ul class="clist">
        <li>Mitos y verdades: ${sc.mythsC||0} de ${sc.mythsT||0} respondidos</li>
        <li>Datos que se pueden compartir: ${sc.privC||0} de ${sc.privT||0}</li>
        <li>Preguntas de comprobación: ${sc.quizC||0} de ${sc.quizT||0}</li>
        <li>Rúbrica del reto: ${sc.rub||0} de ${RUBRIC.length}</li></ul></div>
    </div>
    <div class="scroll" style="margin-top:12px"><table class="cmpt"><thead><tr><th>Habilidad</th><th>Antes</th><th>Ahora</th></tr></thead><tbody>${SKILLS.map((x,i)=>`<tr><td>${esc(x)}</td><td>${(p.pre||{})[i]||"—"}</td><td>${(p.post||{})[i]||"—"}</td></tr>`).join("")}</tbody></table></div>
    <div style="margin-top:14px">${confirming
      ? `<div class="fb no" role="status"><b>¿Eliminar este registro del panel?</b> Se borrarán su registro y todo su progreso de forma permanente.</div><div class="row" style="margin-top:8px"><button class="btn small" data-a="pdel" data-id="${esc(p.id)}">Sí, eliminar</button><button class="btn small ghost" data-a="pdelno">Cancelar</button></div>`
      : `<button class="btn small ghost" data-a="pdelask" data-id="${esc(p.id)}">Eliminar registro</button>`}</div>
    ${V.flash?`<p class="hint" role="status">${esc(V.flash)}</p>`:""}
  </div>`;
}
async function deleteParticipant(id){
  try{ await api("/admin/participants/"+encodeURIComponent(id), {method:"DELETE", admin:true}); PART = PART.filter(x=>x.id!==id); V.sel=null; V.delId=null; V.flash=""; }
  catch(e){ if(e.code==="unauthorized"){ adminLogout(); return; } V.flash="No se pudo eliminar el registro. Intenta de nuevo."; }
  fillPanel();
}
async function exportCsv(btn){
  const head = ["Nombre","Área","Cargo","Experiencia con IA","Registrado","Última actividad","Módulos completados","Avance %","Estado","Autoevaluación antes","Autoevaluación ahora","Mejora","Mitos (aciertos)","Datos compartibles (aciertos)","Comprobaciones (aciertos)","Rúbrica del reto"];
  const iso = ms => ms ? new Date(ms).toISOString().slice(0,16).replace("T"," ") : "";
  const mean = o => { const v=Object.values(o||{}).filter(x=>typeof x==="number"); return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length*100)/100 : ""; };
  const rows = PART.slice().sort((a,b)=>nameOf(a).localeCompare(nameOf(b))).map(p=>{
    const sc = p.scores||{}, gn = gain(p);
    return [nameOf(p),p.area||"",p.cargo||"",p.nivel||"",iso(p.registeredAt),iso(p.lastActivity),(p.done||[]).length,pct(p),stateOf(p),mean(p.pre),mean(p.post),gn===null?"":Math.round(gn*100)/100,sc.mythsC||0,sc.privC||0,sc.quizC||0,sc.rub||0];
  });
  const cell = v => { let t = String(v==null?"":v); if(typeof v!=="number" && /^[=+\-@]/.test(t)) t = "'"+t; return '"'+t.replace(/"/g,'""')+'"'; };
  const csv = "\ufeff" + [head].concat(rows).map(r=>r.map(cell).join(",")).join("\r\n");
  try{
    const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "avance-ruta-ia.csv";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
    flash(btn,"Listo");
  }catch(e){ flash(btn,"No disponible"); }
}

/* ---------- eventos ---------- */
function flash(btn, txt){ if(!btn) return; const o=btn.textContent; btn.textContent=txt; setTimeout(()=>{btn.textContent=o;},1400); }
async function copyText(t, btn){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=t; ta.style.cssText="position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(_){} ta.remove(); }
  flash(btn,"Copiado");
}
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-a]"); if(!el) return;
  const a = el.dataset.a, i = el.dataset.i!==undefined?+el.dataset.i:null;
  switch(a){
    case "facil": S.facil=!S.facil; save(); render(true); return;
    case "go": S.step=i; save(); render(false); return;
    case "prev": if(S.step>0){S.step--; save(); render(false);} return;
    case "next": S.done[STEPS[S.step].id]=true; if(S.step<STEPS.length-1) S.step++; save(); render(false); return;
    case "finish": S.done[STEPS[S.step].id]=true; save(); render(true); return;
    case "rate": S[el.dataset.t][i]=+el.dataset.v; save(); render(true); return;
    case "myth": S.myths[i]=el.dataset.v==="true"; save(); render(true); return;
    case "quiz": S.quiz[el.dataset.id]=+el.dataset.v; save(); render(true); return;
    case "role": S.role=el.dataset.v; save(); render(true); return;
    case "chk": S.chk[i]=el.checked; save(); return;
    case "rubric": S.rubric[i]=el.checked; save(); render(true); return;
    case "spottab": S.spotTab=el.dataset.v; save(); render(true); return;
    case "spot": { const arr=S.spot[S.spotTab]; const k=arr.indexOf(i); if(k>-1) arr.splice(k,1); else arr.push(i); save(); render(true); return; }
    case "spotcheck": S.spotDone[S.spotTab]=true; save(); render(true); return;
    case "spotreset": S.spot[S.spotTab]=[]; S.spotDone[S.spotTab]=false; save(); render(true); return;
    case "priv": S.priv[i]=el.dataset.v; save(); render(true); return;
    case "chall": S.chall=i; save(); render(true); return;
    case "ntpgen": { const ph=NTP[S.ntp.i]; let r=Math.random()*100, acc=0, pick=0; for(let k=0;k<ph.c.length;k++){ acc+=ph.c[k].v; if(r<acc){pick=k;break;} } S.ntp.picks.push(pick); if(S.ntp.picks.length>50) S.ntp.picks.shift(); save(); render(true); return; }
    case "ntpswap": S.ntp.i=(S.ntp.i+1)%NTP.length; S.ntp.picks=[]; save(); render(true); return;
    case "ctx": S.ctx[el.dataset.k]=el.checked; save(); render(true); return;
    case "node": S.node[el.dataset.g]=el.dataset.v; save(); render(true); return;
    case "copy": copyText(el.dataset.t, el); return;
    case "copyPrompt": { const p=buildPrompt(); if(p) copyText(p, el); else flash(el,"Completa un campo"); return; }
    case "copySummary": copyText(summaryText(), el); return;
    case "resetask": V.cr=true; render(true); return;
    case "cancelreset": V.cr=false; render(true); return;
    case "reset": { const reg=S.reg; S=defaults(); S.reg=reg; V.cr=false; save(); flushNow(); render(false); return; }
    case "view": V.view=el.dataset.v; V.delId=null; if(V.view==="registro") initRegForm(); render(false); return;
    case "regsave": saveReg(); return;
    case "psel": V.sel=el.dataset.id; V.delId=null; V.flash=""; fillPanel(); return;
    case "pclose": V.sel=null; V.delId=null; fillPanel(); return;
    case "pdelask": V.delId=el.dataset.id; fillPanel(); return;
    case "pdelno": V.delId=null; fillPanel(); return;
    case "pdel": deleteParticipant(el.dataset.id); return;
    case "csv": exportCsv(el); return;
    case "adminlogin": adminLogin(); return;
    case "logout": adminLogout(); return;
    case "usecode": { const c = window.prompt("Pega tu código de acceso"); if(c && c.trim()) recoverWithCode(c.trim()); return; }
  }
});
function onInput(e){
  const t = e.target;
  if(e.type==="change" && !(t.tagName==="SELECT" || t.type==="checkbox")) return;
  if(t.dataset.field){
    S.fields[t.dataset.field]=t.value; save();
    const wrap = document.querySelector(`[data-wrap="${t.dataset.field}"]`); if(wrap) wrap.classList.toggle("filled", !!t.value.trim());
    const p = buildPrompt(), n = FIELDS.filter(x=>(S.fields[x.k]||"").trim()).length;
    const pv = document.getElementById("pv"); pv.innerHTML = pvHtml(); pv.classList.toggle("empty", !p);
    document.getElementById("clar").innerHTML = clarHtml(n); document.getElementById("pvc").textContent = pvcText(n);
  } else if(t.hasAttribute("data-task")){ S.task=t.value; save(); }
  else if(t.hasAttribute("data-plan")){ S.plan=t.value; save(); }
  else if(t.hasAttribute("data-tok")){
    S.tok=t.value; save(); const st=tokStats(t.value);
    document.getElementById("tk-c").textContent=st.c; document.getElementById("tk-w").textContent=st.w; document.getElementById("tk-t").textContent=st.t;
  }
  else if(t.hasAttribute("data-psearch")){ V.q=t.value; fillPanel(); }
  else if(t.hasAttribute("data-parea")){ V.area=t.value; fillPanel(); }
  else if(t.hasAttribute("data-pstate")){ V.state=t.value; fillPanel(); }
  else if(t.dataset.reg){ if(!V.rf) initRegForm(); V.rf[t.dataset.reg] = t.type==="checkbox" ? t.checked : t.value; }
}
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target && e.target.id==="adminpw"){ e.preventDefault(); adminLogin(); } });
document.addEventListener("input", onInput);
document.addEventListener("change", onInput);

if(S.step<0||S.step>=STEPS.length) S.step=0;
render(true);
initCloud();
</script>
